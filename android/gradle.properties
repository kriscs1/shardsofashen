# The app's id on the Play Store: once it's published it can never change.
dsPackage=io.github.kriscs1.shardsofashen
# The Python the build uses to pack the server's Python (the same version as the app's, 3.11). Blank: Chaquopy looks
# for it (python3.11, or "py -3.11" on Windows).
dsBuildPython=

# AdMob (apps.admob.com): the app's id (ca-app-pub-...~...) and the start screen's banner unit (ca-app-pub-.../...).
# Blank: a debug build shows Google's test ads, a release build none. The workflow's DS_ADMOB_APP and DS_ADMOB_BANNER win.
dsAdmobApp=
dsAdmobBanner=

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
