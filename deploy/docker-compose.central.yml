# The central server (central/): every player's account and friends, the list of remote game servers, the ads on the
# start screen, and the start screen for a browser. One for the whole game: the apps and every game server point at it
# (web/home/config.js DS_CENTRAL_DEFAULT; a game server's DS_CENTRAL). The same image as the game, run as
# "python -m central", with Caddy in front (HTTPS) and an updater that restarts it whenever a newer image is out.
# Everything it keeps is in the centraldata volume.
#
# deploy/central-setup.sh sets it all up on a fresh Ubuntu or Debian VM. By hand: put this file, Caddyfile.central
# (as Caddyfile) and a .env (from central.env.example: DS_CENTRAL_DOMAIN is the one you must set) in one folder,
# then "docker compose up -d".
#
# Ads: a JSON list in the volume's ads.json, [{"text": "...", "link": "https://...", "image": "banner.png"}], the
# pictures in its ads/ folder (docker compose cp ads.json central:/data/ads.json). Without it, the game's own notes.
name: shards-of-ashen-central

services:
  central:
    image: ${DS_IMAGE:-ghcr.io/kriscs1/shardsofashen:latest}
    restart: unless-stopped
    command: ["python", "-m", "central"]
    environment:
      DS_CENTRAL_DB: /data/central.db
      DS_CENTRAL_NAME: ${DS_CENTRAL_NAME:-Shards of Ashen}
      DS_CENTRAL_MOTD: ${DS_CENTRAL_MOTD:-}
      DS_CENTRAL_ADS: /data/ads.json
      DS_CENTRAL_ADS_DIR: /data/ads
      DS_REGISTRATION: ${DS_REGISTRATION:-open}
      DS_PASSWORD_MIN: ${DS_PASSWORD_MIN:-8}
      DS_REGISTER_PER_DAY: ${DS_REGISTER_PER_DAY:-3}
      DS_TRUST_PROXY: "1"
      DS_CENTRAL_ADMINS: ${DS_CENTRAL_ADMINS:-}        # (who may use /admin: approve servers, accounts, ads)
      DS_CENTRAL_APPROVED: ${DS_CENTRAL_APPROVED:-}    # (servers listed without waiting: their ids, comma-separated)
      DS_CENTRAL_OPERATOR: ${DS_CENTRAL_OPERATOR:-}    # (the privacy policy: who runs it, and how to reach them)
      DS_CENTRAL_CONTACT: ${DS_CENTRAL_CONTACT:-}
      DS_SMTP_HOST: ${DS_SMTP_HOST:-}                  # (email: a forgotten password's code; none, and it's the
      DS_SMTP_PORT: ${DS_SMTP_PORT:-587}               #  recovery code alone)
      DS_SMTP_USER: ${DS_SMTP_USER:-}
      DS_SMTP_PASSWORD: ${DS_SMTP_PASSWORD:-}
      DS_SMTP_FROM: ${DS_SMTP_FROM:-}
      DS_SMTP_TLS: ${DS_SMTP_TLS:-starttls}
      DS_ADSENSE_CLIENT: ${DS_ADSENSE_CLIENT:-}        # (ca-pub-...: AdSense on the start screen in a browser)
      DS_ADSENSE_SLOT: ${DS_ADSENSE_SLOT:-}
      DS_ADMOB_APP: ${DS_ADMOB_APP:-}                  # (ca-app-pub-...~...: the Android app's, for /app-ads.txt and the privacy policy)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - centraldata:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [central]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DS_CENTRAL_DOMAIN: ${DS_CENTRAL_DOMAIN:?set DS_CENTRAL_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  updater:
    image: docker:28-cli
    restart: unless-stopped
    depends_on: [central]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/deploy:ro
    working_dir: /deploy
    environment:
      GHCR_USER: ${GHCR_USER:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      DS_UPDATE_SECONDS: ${DS_UPDATE_SECONDS:-300}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -n "$$GHCR_TOKEN" ]; then echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USER" --password-stdin; fi;
        echo "Checking for updates every $$DS_UPDATE_SECONDS seconds";
        while true; do
          sleep "$$DS_UPDATE_SECONDS";
          if docker compose -p shards-of-ashen-central pull -q central; then docker compose -p shards-of-ashen-central up -d central; fi;
        done

volumes:
  centraldata:
  caddy_data:
  caddy_config:
