; The weather (ashen\weather.py): it changes every few minutes to what suits where you are, fading out and in.
; Only outdoors on the surface; indoors you only hear it. Config.ini [Gameplay] Weather=0 turns it off.

[Weather]
; Seconds before the first change, and how long each weather lasts (min-max)
First=60
Lasts=120-300
; Seconds the weather takes to clear, and to set in
Fade.Out=12
Fade.In=15
; The colour clouds darken the world with (each kind's Shade says how much)
Shade.Colour=40 46 58
; What a weather turns into in a climate that has neither it nor what it Becomes
Otherwise=cloudy
; In a storm (a kind with Lightning=1): seconds between flashes, seconds from a flash to its thunder, the thunder sound
Lightning.Every=7-18
Thunder.After=0.4-2.2
Thunder.Sound=Thunder

; ---- The kinds of weather ([Kind.<name>]).
; Shade: how dark the clouds make it (0-255). Message: said as it sets in.
; Draw: rain, snow or fog (blank = nothing falls). Amount: how much of it. Colour: the rain's.
; Wind: pixels a second the snow blows sideways.
; Ambient: the background sound while it's on (sounds\Ambient_<name>.wav), in place of the place's own.
; Becomes: what it is instead in a climate that doesn't have it (rain falls as snow in the snow).
[Kind.clear]
Shade=0

[Kind.cloudy]
Shade=26
Message=Clouds cover the sun.

[Kind.rain]
Shade=48
Message=It starts to rain.
Draw=rain
Amount=1
Colour=168 182 206
Ambient=Rain
Becomes=snow

[Kind.storm]
Shade=82
Message=Thunder rumbles: a storm is coming.
Draw=rain
Amount=1.9
Colour=168 182 206
Ambient=Storm
Lightning=1
Becomes=blizzard

[Kind.snow]
Shade=30
Message=Snow begins to fall.
Draw=snow
Amount=1
Wind=18
Becomes=rain

[Kind.blizzard]
Shade=64
Message=The wind rises: a blizzard!
Draw=snow
Amount=2.2
Wind=140
Ambient=Snow
Becomes=storm

[Kind.fog]
Shade=18
Message=A fog rolls in.
Draw=fog
Amount=1

; ---- The climates. A map's data\Ambient.ini sound picks its climate: [Climate.<sound>], or [Climate.Default].
; Each key is a kind of weather, and how likely it is there.
[Climate.Default]
clear=5
cloudy=3
rain=2
storm=1

[Climate.Snow]
clear=3
cloudy=2
snow=3
blizzard=1

[Climate.Desert]
clear=9
cloudy=1

[Climate.Marsh]
fog=4
rain=2
cloudy=2
clear=1

[Climate.Forest]
clear=5
cloudy=3
rain=2
storm=1
fog=1
