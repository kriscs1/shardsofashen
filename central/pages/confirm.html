<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{TITLE}} - {{NAME}}</title>
<style>
:root { --bg: #180e0a; --panel: #33221b; --edge: #7e4d3f; --ink: #f3e888; --parchment: #e6d6a8; }
body { margin: 0; background: var(--bg); color: var(--parchment); font: 17px/1.55 "Palatino Linotype", Palatino, Georgia, serif; }
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
article { background: var(--panel); border: 3px solid var(--edge); border-radius: 14px; padding: 20px 24px; overflow-wrap: anywhere; }
h1 { color: var(--ink); margin-top: 0; font-size: 24px; }
a { color: var(--ink); }
button { font: inherit; font-weight: bold; min-height: 44px; padding: 8px 22px; color: var(--ink); background: #237a40;
  border: 2px solid #4fbf77; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>
<main><article>
<h1>{{TITLE}}</h1>
<p>{{WORDS}}</p>
{{FORM}}
</article></main>
</body>
</html>
