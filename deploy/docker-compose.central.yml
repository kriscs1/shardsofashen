# The central server (central/): every player's account and friends, the list of remote game servers, and the start
# screen for a browser. One for the whole game: the apps and every game server point at it
# (web/home/config.js DS_CENTRAL_DEFAULT; a game server's DS_CENTRAL). The same image as the game, run as
# "python -m central", with Caddy in front (HTTPS) and an updater that restarts it whenever a newer image is out.
# Everything it keeps is in the centraldata volume.
#
# deploy/central-setup.sh sets it all up on a fresh Ubuntu or Debian VM. By hand: put this file, Caddyfile.central
# (as Caddyfile) and a .env (from central.env.example: DS_CENTRAL_DOMAIN is the one you must set) in one folder,
# then "docker compose up -d".
name: shards-of-ashen-central

services:
  central:
    image: ${DS_IMAGE:-ghcr.io/kriscs1/shardsofashen:latest}
    restart: unless-stopped
    command: ["python", "-m", "central"]
    environment:
      DS_CENTRAL_DB: /data/central.db
      DS_CENTRAL_NAME: ${DS_CENTRAL_NAME:-Shards of Ashen}
      DS_CENTRAL_MOTD: ${DS_CENTRAL_MOTD:-}
      DS_REGISTRATION: ${DS_REGISTRATION:-open}
      DS_PASSWORD_MIN: ${DS_PASSWORD_MIN:-8}
      DS_REGISTER_PER_DAY: ${DS_REGISTER_PER_DAY:-3}
      DS_TRUST_PROXY: "1"
      DS_CENTRAL_ADMINS: ${DS_CENTRAL_ADMINS:-}        # (who may use /admin: approve servers, accounts)
      DS_CENTRAL_APPROVED: ${DS_CENTRAL_APPROVED:-}    # (servers listed without waiting: their ids, comma-separated)
      DS_CENTRAL_OPERATOR: ${DS_CENTRAL_OPERATOR:-}    # (the privacy policy: who runs it, and how to reach them)
      DS_CENTRAL_CONTACT: ${DS_CENTRAL_CONTACT:-}
      DS_SMTP_HOST: ${DS_SMTP_HOST:-}                  # (email: a link to confirm it, a forgotten password's code; none, and
      DS_SMTP_PORT: ${DS_SMTP_PORT:-587}               #  a forgotten password can't be reset)
      DS_SMTP_USER: ${DS_SMTP_USER:-}
      DS_SMTP_PASSWORD: ${DS_SMTP_PASSWORD:-}
      DS_SMTP_FROM: ${DS_SMTP_FROM:-}
      DS_SMTP_TLS: ${DS_SMTP_TLS:-starttls}
      DS_SUPPORT_EMAIL: ${DS_SUPPORT_EMAIL:-}          # (where a game's Send log goes: support@hallisium.com if empty)
      DS_GOOGLE_CLIENT_ID: ${DS_GOOGLE_CLIENT_ID:-}    # (sign in with Google: README-Server.md says how; none, no button)
      DS_GOOGLE_CLIENT_SECRET: ${DS_GOOGLE_CLIENT_SECRET:-}
      DS_DEMO: ${DS_DEMO:-}                            # (1: an account without the full game plays the demo; README-Server.md "Owning the game")
      DS_PLAY_SERVICE_ACCOUNT: ${DS_PLAY_SERVICE_ACCOUNT:-}   # (/data/play.json: Google Play's service account key, for purchases)
      DS_PLAY_PACKAGE: ${DS_PLAY_PACKAGE:-io.github.kriscs1.shardsofashen}
      DS_FULL_PRODUCT: ${DS_FULL_PRODUCT:-full_game}
      DS_STEAM_APP: ${DS_STEAM_APP:-}                  # (Steam: the app's id, and a publisher Web API key)
      DS_STEAM_KEY: ${DS_STEAM_KEY:-}
      DS_ITCH_GAME: ${DS_ITCH_GAME:-}                  # (itch.io: the game's id, and an API key)
      DS_ITCH_KEY: ${DS_ITCH_KEY:-}
      DS_BUY_URL: ${DS_BUY_URL:-}                      # (the website's Buy: the game's itch.io page, and its price as shown)
      DS_BUY_PRICE: ${DS_BUY_PRICE:-}
      DS_BACKUP_S3: ${DS_BACKUP_S3:-}                  # (each day's backup off the machine too: README-Server.md "Backups off the machine")
      DS_BACKUP_S3_KEY: ${DS_BACKUP_S3_KEY:-}
      DS_BACKUP_S3_SECRET: ${DS_BACKUP_S3_SECRET:-}
      DS_BACKUP_S3_REGION: ${DS_BACKUP_S3_REGION:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - centraldata:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [central]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DS_CENTRAL_DOMAIN: ${DS_CENTRAL_DOMAIN:?set DS_CENTRAL_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  updater:
    image: docker:28-cli
    restart: unless-stopped
    depends_on: [central]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/deploy:ro
    working_dir: /deploy
    environment:
      GHCR_USER: ${GHCR_USER:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      DS_UPDATE_SECONDS: ${DS_UPDATE_SECONDS:-300}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -n "$$GHCR_TOKEN" ]; then echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USER" --password-stdin; fi;
        echo "Checking for updates every $$DS_UPDATE_SECONDS seconds";
        while true; do
          sleep "$$DS_UPDATE_SECONDS";
          if docker compose -p shards-of-ashen-central pull -q central; then docker compose -p shards-of-ashen-central up -d central; fi;
        done

volumes:
  centraldata:
  caddy_data:
  caddy_config:
