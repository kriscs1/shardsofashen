# Trying changes on this PC before publishing them: builds the server from these files ("Test Locally.bat").
# http://localhost:8484. Its characters and world are its own (the testdata volume), not the real server's.
name: shards-of-ashen-test

services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:                                 # (the version: Test Locally.bat reads them from git)
        DS_BUILD: ${DS_BUILD:-}
        DS_COMMIT: ${DS_COMMIT:-}
        DS_BUILD_DATE: ${DS_BUILD_DATE:-}
    image: shards-of-ashen:local
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      - testdata:/data
    stop_grace_period: 30s

volumes:
  testdata:
