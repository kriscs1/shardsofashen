
[Debugging]
Logging.Enabled=1
;Fullscreen cannot be disabled yet
Fullscreen=1

[Gameplay]
;The player's level (quests' Requires.Level): the average of their best Level.Best of Level.Skills
Level.Skills=Strength,Defence,Channeling
Level.Best=2
;Player.Movement.Speed: tiles per second if under 10, otherwise pixels per second (Goblins move at 2)
Player.Movement.Speed = 3
Player.Attack.Speed = 0.8 
;Maximum hitpoints = Hitpoints.Base + Hitpoints.Per.Level x (your Strength level + Defence level)
Hitpoints.Base = 19
Hitpoints.Per.Level = 1
;Out of combat for HP.Regen.Delay seconds, you get a hitpoint back every HP.Regen.Every seconds
HP.Regen.Delay = 10
HP.Regen.Every = 5
;Levelling slows as you go: at level L a skill learns XP.Slowdown/(XP.Slowdown+L) as fast (0 = never slows)
XP.Slowdown = 5
;Every skill's gains are XP.Scale times what a script or the game gives
XP.Scale = 0.5
;Fighting is mostly your gear: to land a blow your weapon's Attack counts 3 times (Strength two thirds), against
;3 x the monster's Defence; you hit for up to 1 + Strength/4 + 2 x Attack. A monster lands a blow against your
;armour x 1.5 (Defence level a half), and your armour soaks a sixth of its total off every blow.
;A monster hits for up to 1 + its Strength x Monster.Damage
Monster.Damage = 2
;Dying loses this percentage of the gold you're carrying
Death.Gold.Loss = 25
;Weather (rain, storms, snow, fog): 1 on, 0 off
Weather = 1
;Dying leaves everything else you carried in a grave where you fell, for this many minutes of play
Grave.Minutes=2
;The highest level any skill can reach
Skill.Max.Level = 25
Player.Visible = 1 
NPC.Respawn.Delay = 10 
;Seconds before what's bought from a shop comes back in (scaled up by its Value, to 4 times)
Shop.Restock.Seconds = 3600
;Shops have in fewer than their rack's stock, and now and then none (1); 0: always all of it. A rack's own
;Vary.Stock= wins. Each delivery lasts Shop.Stock.Hours (real hours); Shop.Sold.Out is the chance (percent)
;a thing is sold out for one
Shop.Vary.Stock = 1
Shop.Stock.Hours = 6
Shop.Sold.Out = 10
;Shops pay Value x their Sell.Rate x this for what you sell them (0.25: a quarter of their usual offer)
Sell.Price.Factor = 0.25
;The tavern's games: at most this many bets in Gamble.Window.Minutes (real minutes; 0 = no limit)
Gamble.Max.Bets = 10
Gamble.Window.Minutes = 60
;Seconds before an item picked up off the map comes back (scaled by its Value; an item's own Respawn= wins)
Item.Respawn.Delay = 600
;Seconds dropped items stay on the ground before they despawn
Item.Despawn.Delay = 180
Maximum.Bank.Slots = 50 
FogOfWar.Enabled = 1
;Minutes between automatic saves (the game also saves on every map change and when it closes; 0 = only those)
AutoSave.Minutes = 3
FogOfWar.Viewable.Distance = 200
;Radius in pixels of the light round the player at night (0 = none)
Night.Light.Radius=130
Start.Map=4,0,0
Start.X=224
Start.Y=336
Aggro.Raised=1.3

[Interface]
Map.X.Tiles=25                
Map.Y.Tiles=21 
;Fog of war cells in pixels (16 = 50 x 42 cells a map; 32 = one a tile). Should divide 800 and 672 so cells line up at map edges
FogOfWar.Cell.Size=16
;1 = soft fog edges, 0 = square cells
FogOfWar.Smooth=1
;How dark the fog over places you have already seen is (0 = clear, 255 = black)
FogOfWar.Seen.Darkness=130
;1 = the playfield widens to fill a widescreen display, 0 = the classic 1024 x 768 layout
Widescreen=1
;Map zoom (0.75, 1, 1.5, 2 or 3): the mouse wheel and + / - change it and it is remembered here
Zoom=1
;How quickly the camera catches up with the player (higher = snappier, 0 = no easing)
Camera.Smooth=8
;1 = smooth scaling to the screen (easier to read text), 0 = sharp square pixels
Smooth.Scaling=1
