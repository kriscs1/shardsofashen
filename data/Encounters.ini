; Random encounters (dsengine/encounters.py): now and then, out of doors, someone or something turns up near a player.
; [Encounters]: Every.Minutes, about how long between a player's encounters; Near.Tiles, Far.Tiles, how far off they
;   turn up; Apart.Tiles, never another this near that player while one's about. On=0 turns them off.
; Each kind: NPC (Entities.ini), Attitude, Weight (how likely against the others), Max (in the world at once), Minutes
;   (how long it stays), Requires (a condition, as a Lock's), Min.Level (the player's), Where=Wild (never a settlement's
;   map), Forms=1 (drawn together out of Shard essence; else it walks in), Rack (its ItemRacks.ini shop, if it has one),
;   Sound, Message and Message.Sound (for whoever's near), Say and Goodbye (bubbles; | between takes).
;   Scales=1: as strong as the player it found, Level.Plus levels up: Hitpoints, Hitpoints.Per.Level, Strength,
;   Strength.Per.Level, Defence, Defence.Per.Level.

[Encounters]
On=1
Every.Minutes=25
Near.Tiles=8
Far.Tiles=12
Apart.Tiles=40

[Salesman]
NPC=Travelling_Salesman
Attitude=Good
Weight=4
Max=1
Minutes=8
Requires=$Attr.Passage>=5
Rack=SHOP-Salesman
Sound=Salesman_Bell
Say=Fine wares! Finer than you've seen, and further from home!|Hold up, friend! Hold up! I've just the thing!|Wares! Wares for the road! Wares for after the road!
Goodbye=The road calls, friend. It's rude, but it calls.|Mind how you go. No refunds!

[Jester]
NPC=Jester
Attitude=Good
Weight=3
Max=1
Minutes=5
Requires=$Attr.Passage>=5
Sound=Jester_Bells
Say=Ho there! You look like someone in need of a joke!|Ta-daa! ...Nobody? Just you, then.|A kingdom for an audience! Or, failing that, you.
Goodbye=Exit, pursued by nothing in particular!|Same time next year! I shan't say where.

[Abomination]
NPC=Shard_Abomination
Attitude=Bad
Weight=2
Max=2
Minutes=6
Where=Wild
Min.Level=5
Forms=1
Sound=Abomination_Rise
Message=The air tears, and something made of broken magic pulls itself together.
Message.Sound=-
Scales=1
Level.Plus=1
Hitpoints=30
Hitpoints.Per.Level=12
Strength=2
Strength.Per.Level=0.9
Defence=1
Defence.Per.Level=0.7

[Mending_Wayfarer]
; One of the Mending on the road (build_mending.py): a few Shards for nothing, remembered (MendingGift)
NPC=Mending_Wayfarer
Attitude=Good
Weight=2
Max=1
Minutes=6
Min.Level=12
Where=Wild
Requires=$Attr.ColdFireQuest>=3 and $Attr.HeartChoice<3 and $Attr.EldestEnd<>1
Say=Cold out, friend. Come and get warm.|Peace on your road, friend.|You look tired, friend. Sit a while.
Goodbye=Go gently, friend. We'll see you again.|Peace on your road.

