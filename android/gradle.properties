# The game's address: the app opens https://<dsHost>/?app=android. Set it to your server's public HTTPS name (the
# DS_DOMAIN of deploy/.env), here or with -PdsHost=... (the GitHub workflow takes it from the DS_APP_HOST variable).
dsHost=dragonsword.example.com
# The app's id on the Play Store: once it's published it can never change.
dsPackage=io.github.kriscs1.dragonsword

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
