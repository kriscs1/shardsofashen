[Remnants]
; Shard Remnants (dsengine/remnants.py): a monster's magic, left when it dies. Its level is its
; Entities.ini Level= (1-25). Written by dev\migrate\build_remnants.py: edit the numbers here.
; In 100: a monster that dies leaves Shard Remnants on the ground
Chance=45
; How many
Count=1-2
; And this many more for each level of the monster (Entities.ini Level=)
Count.Per.Level=0.25
; In 100: instead, its magic rises as a Shard Remnant and attacks its killer
Mob.Chance=6
; Only from monsters of this level and up
Mob.Min.Level=2
; The Shard Remnant's hitpoints: this, and Mob.Hitpoints.Per.Level for each level
Mob.Hitpoints=5
Mob.Hitpoints.Per.Level=5
; Its strength and defence the same way
Mob.Strength=1
Mob.Strength.Per.Level=0.5
Mob.Defence=1
Mob.Defence.Per.Level=0.5
; The remnants it leaves when it's killed (and Count.Per.Level more for each level)
Mob.Count=3-6
; Seconds it lingers if nobody fights it
Mob.Lasts=120
; Shards from each remnant absorbed
Absorb=1
; Magic xp for each
Absorb.Magic.XP=0.05
