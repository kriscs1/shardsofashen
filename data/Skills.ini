; The journal's Skills page (dsengine/quests.py skill_pages): how each skill is levelled, in the player's words.
; Trains: how it's learnt. Opens.N=<level> <what>: what a level opens up that no other file says. The rest of what
; opens up at each level is read from where it's set (crafting lists, Gathering.ini, Spells.ini, Buildables.ini,
; Entities.ini Requires=, Thieving.ini, Shards.ini [Enchant]), so it's never out of date. Edit the words here.

[Attack]
Trains=Hit things in a fight, with a weapon or your bare hands: the harder the blow, the more you learn. Forcing a chest open teaches you a little too. Better at it, you land more blows and hit harder, and you can wield better weapons. In the Fighting stance some of what you learn in a fight comes here.

[Defence]
Trains=Take blows in a fight, and block or dodge them: you learn from every blow, landed or turned aside. Better defended, you're hit less often and for less, and you can wear better armour. Out of any stance (Cautious) some of what you learn in a fight comes here.

[Channeling]
Trains=Cast spells: every cast teaches you something, a harder spell more. The better you are, the harder a spell hits, the more surely it takes and the fewer Shards each cast drinks.

[Shardcraft]
Trains=Work Shard magic: wake shardstones, absorb the Shard Remnants beasts leave behind, break gear down for its Shards, enchant gear with a rare shard and write a spell of your own.

[Cooking]
Trains=Cook what you catch, hunt and grow, over a fire or at a range, and make meals of what you've cooked.

[Crafting]
Trains=Smelt ore and forge at a furnace and anvil, shear sheep, and tan, spin and make jewellery at a workbench. Mending worn gear on an anvil teaches you too.

[Fishing]
Trains=Fish with a rod and bait where the water ripples (each catch takes a bait). Better fish bite for better fishers, in harder places.

[Mining]
Trains=Mine rocks with a pickaxe, in the mines and caves. Digging with a spade teaches you a little too.

[Woodcutting]
Trains=Chop trees with an axe.

[Alchemy]
Trains=Pick herbs, berries and mushrooms, and brew draughts and potions from them at an alchemy table.

[Homesteading]
Trains=Build on your homestead, and sow and harvest crops: in your own soil, or the farmer's furrows by Ashford.

[Stealth]
Trains=Go unseen and light-fingered: sneak past those watching, strike before you're seen, pick pockets and locks, lift wares from shelves and valuables from houses, and spot traps and secrets (and disarm the traps).
