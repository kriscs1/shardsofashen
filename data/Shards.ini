; Shards of Estforlan: every Shard number in one place (dsengine/shards.py and remnants.py read it as the
; game runs). Spells' own costs are Spells.ini Cost=; digging's Shards Digging.ini; quests' Quests.ini
; Reward.Shards. dev\migrate\build_shards.py and build_remnants.py only add what's missing: edit them here.

[Shards]
; Start: a new character's Shards. Old.Save.Grant: given once to a character from before Shards.
; Cast.Gap: seconds between any two casts.
; Shardstone: waking a shardstone the first time (Shardstone.<Place>: one that costs more);
; Shardstone.Travel: each journey after.
; Chest.Chance in 100 that a chest's treasure has Chest=lo-hi Shards too.
; Scrolls.Rarer: the builder's mark that scrolls were made rarer, once (leave it).
Start=12
Old.Save.Grant=20
Cast.Gap=0.8
Shardstone=5
Shardstone.Wardhaven=10
Shardstone.Emberwatch=10
Shardstone.Frosthold=10
Shardstone.Dunerest=10
Shardstone.Saltmarsh=10
Shardstone.Galaith=20
Shardstone.Travel=2
Chest.Chance=40
Chest=3-15
Scrolls.Rarer=1
; Galaith.Seam: the Shards the King's seam in Galaith's mine gives, once every Galaith.Seam.Hours (real) hours.
Galaith.Seam=12
Galaith.Seam.Hours=20

