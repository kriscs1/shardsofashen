# A plain Linux server without Unraid: the game from GitHub's registry, and an updater that looks for a newer image
# every few minutes and restarts the game with it (everyone's progress is kept in the gamedata volume). Both start
# again on their own whenever Docker starts. This file is inside the game's image, so a server needs nothing else:
#
#   docker run --rm ghcr.io/kriscs1/shardsofashen cat docker-compose.yml > docker-compose.yml && docker compose up -d
#
# Settings: put them in a file called .env beside this one (one per line, e.g. DS_PORT=8090), or change the defaults
# after ":-" below. Then "docker compose up -d" again.
#   DS_PORT           the port players connect to: http://<server>:<port> (8484)
#   DS_DATA           where the game's data is kept: accounts, characters, the world, homes, daily backups. A folder
#                     on the server (e.g. /srv/shards-of-ashen) or a Docker volume's name (gamedata, the default)
#   DS_ADMINS         Shards accounts whose characters get the Admin button, comma-separated: DS_ADMINS=Kris,Ann
#                     (the central server proves them, so it needs DS_CENTRAL)
#   DS_CENTRAL        the central server, for signing in by Shards accounts: DS_CENTRAL=https://shardsofashen.hallisium.com
#   DS_PUBLIC         1: listed on the start screen's Public servers, once approved on the central server's admin
#                     page. Everyone then needs a Shards account, even on your own network
#   DS_PUBLIC_URL     the address players outside your network use (blank: where it calls the central server from)
#   DS_TRUST_PROXY    1 if players come through a reverse proxy, so those on your own network still count as on it:
#                     without it, anyone coming through the proxy needs a Shards account
#   DS_INVITE_CODE    if set, making a character needs this code
#   DS_NAME           what players see it called: the Public servers list, the login screen, the Android app's list
#   DS_REGISTRATION   open (anyone can make a character) or closed (only accounts made with tools/admin.py)
#   DS_MAX_PLAYERS    how many can play at once (5)
#   DS_UPDATE_SECONDS how often to look for a new version (300)
#   GHCR_USER / GHCR_TOKEN   only if the image is private
name: shards-of-ashen

services:
  game:
    image: ${DS_IMAGE:-ghcr.io/kriscs1/shardsofashen:latest}
    restart: unless-stopped
    ports:
      - "${DS_PORT:-8484}:8484"
    environment:
      DS_MAX_PLAYERS: ${DS_MAX_PLAYERS:-5}
      DS_REGISTRATION: ${DS_REGISTRATION:-open}
      DS_INVITE_CODE: ${DS_INVITE_CODE:-}
      DS_ADMINS: ${DS_ADMINS:-}
      DS_NAME: ${DS_NAME:-}
      DS_CENTRAL: ${DS_CENTRAL:-}
      DS_PUBLIC: ${DS_PUBLIC:-0}
      DS_PUBLIC_URL: ${DS_PUBLIC_URL:-}
      DS_TRUST_PROXY: ${DS_TRUST_PROXY:-0}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${DS_DATA:-gamedata}:/data
    stop_grace_period: 30s

  # Docker's own command line (the official image), checking GitHub's registry for a new version of the game.
  # "pull" downloads only what changed; "up -d game" restarts the game only if its image is new.
  updater:
    image: docker:28-cli
    restart: unless-stopped
    depends_on: [game]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/deploy:ro
    working_dir: /deploy
    environment:
      GHCR_USER: ${GHCR_USER:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      DS_UPDATE_SECONDS: ${DS_UPDATE_SECONDS:-300}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -n "$$GHCR_TOKEN" ]; then echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USER" --password-stdin; fi;
        echo "Checking for updates every $$DS_UPDATE_SECONDS seconds";
        while true; do
          sleep "$$DS_UPDATE_SECONDS";
          if docker compose -p shards-of-ashen pull -q game; then docker compose -p shards-of-ashen up -d game; fi;
        done

volumes:
  gamedata:
