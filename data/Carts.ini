; Horses and carts (dsengine/carts.py, dev/migrate/build_carts.py; the map editor draws and edits them).
; [Route]: Title= (what it's called), Fare= (gold a ride), Wait= (seconds at each stop), Loop=1 (round
; and round; else to the end and back). PointN=MAP,X,Y[,Stop name]: its way, a 1-based tile of map MAP
; at a time, in a straight line from each to the next; a point with a name is a stop. Or NodeN= (the
; same) and Order=1,2,3,2,4: the nodes in the order it takes them, a node more than once if it goes by again.

