// The app: the game's server (server/, dsengine/ and their data, the same as on any server) and its web page, in a
// WebView. A phone can host the game for its network, or join one on the network or anywhere else.
plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def env = System.getenv()
def game = file(project.findProperty("dsGame") ?: "../..")   // (the game's folder: everything the server needs comes from it)
// (AdMob: the app's id and the start screen's banner unit, from gradle.properties or the workflow; without them a debug
//  build shows Google's test ads and a release build none)
def TEST_APP = "ca-app-pub-3940256099942544~3347511713", TEST_BANNER = "ca-app-pub-3940256099942544/6300978111"
def admobApp = (env.DS_ADMOB_APP ?: project.findProperty("dsAdmobApp") ?: "").trim()
def admobBanner = (env.DS_ADMOB_BANNER ?: project.findProperty("dsAdmobBanner") ?: "").trim()

android {
    namespace "io.github.kriscs1.shardsofashen"
    compileSdk 36

    defaultConfig {
        applicationId project.property("dsPackage")
        minSdk 24
        targetSdk 36
        // (every build a higher number, as the Play Store wants: the commit count, from the workflow)
        versionCode((env.DS_VERSION_CODE ?: "1") as int)
        versionName env.DS_VERSION_NAME ?: "1.0"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        manifestPlaceholders = [admobApp: admobApp ?: TEST_APP]     // (the SDK won't start without an app id)
        buildConfigField "String", "ADMOB_BANNER", "\"${admobApp && admobBanner ? admobBanner : ""}\""
    }

    signingConfigs {
        release {
            // (the upload key, from the workflow's secrets; without one the release build is left unsigned)
            if (env.DS_KEYSTORE) {
                storeFile file(env.DS_KEYSTORE)
                storePassword env.DS_KEYSTORE_PASSWORD
                keyAlias env.DS_KEY_ALIAS
                keyPassword env.DS_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            if (!(admobApp && admobBanner)) buildConfigField "String", "ADMOB_BANNER", "\"$TEST_BANNER\""
        }
        release {
            minifyEnabled false
            if (env.DS_KEYSTORE) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/game"
    }

    androidResources {
        noCompress "zip"                      // (game.zip is squeezed already)
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-ads:24.4.0"
    implementation "com.google.android.ump:user-messaging-platform:3.2.0"   // (the consent form, in the EEA and UK)
}

chaquopy {
    defaultConfig {
        version "3.11"
        def py = project.property("dsBuildPython").trim()
        if (py) buildPython(*py.split(" "))
        pip {
            install "aiohttp"
        }
    }
}

// ----- the game, packed: unpacked on the phone the first time it hosts (and again after an update)
def gameDir = "$buildDir/generated/game"
tasks.register("packGame", Zip) {
    destinationDirectory = file(gameDir)
    archiveFileName = "game.zip"
    from(game) {
        include "VERSION", "saves/TEMPLATE.ini"
        include "data/**", "maps/**", "sprites/**", "web/**"
        include "ashen/**", "dsengine/**", "server/**"
        exclude "**/__pycache__/**", "**/*.pyc", "**/*.db", "**/*.db-*", "data/backups/**"
    }
    doFirst {
        if (!new File(game, "web/assets/manifest.json").exists())
            throw new GradleException("web/assets is missing: run python -I tools/export_web_assets.py first")
    }
    doLast {
        // (what the phone compares to know it's a new game: when it was packed)
        new File(gameDir, "game.stamp").text = String.valueOf(System.currentTimeMillis())
    }
}
tasks.named("preBuild") { dependsOn "packGame" }
