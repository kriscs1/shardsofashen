# The Android app (android/): an APK to install by hand and a bundle (.aab) for the Play Store, from every push to main
# that changes the app. The game itself isn't in the app (it's the server's web page), so most updates need no new app.
#
# Settings > Secrets and variables > Actions:
#   variable DS_APP_HOST          the server's public HTTPS name (e.g. play.example.com)
#   secret   ANDROID_KEYSTORE     the upload key's keystore, base64 (android/README.md)
#   secrets  ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without the keystore the bundle is unsigned (and the Play Store won't take it); the APK is always signed, with a
# debug key, so it installs.
name: Build the Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # (all the history: the version code is the commit count)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: The upload key (if there is one)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "DS_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          DS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_HOST: ${{ vars.DS_APP_HOST }}
        run: |
          export DS_VERSION_CODE=$(git rev-list --count HEAD)
          export DS_VERSION_NAME="$(cat VERSION).$DS_VERSION_CODE"
          HOST_ARG=""
          if [ -n "$APP_HOST" ]; then HOST_ARG="-PdsHost=$APP_HOST"; fi
          gradle -p android $HOST_ARG assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: dragonsword-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
