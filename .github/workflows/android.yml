# The Android app (android/): an APK to install by hand and a bundle (.aab) for the Play Store, from every push to
# main. The app carries the whole game (its server and page, to host a game on the phone), so every update to the
# game is a new app.
#
# Settings > Secrets and variables > Actions > Secrets (for the Play Store's bundle; android/README.md):
#   ANDROID_KEYSTORE (the upload key's keystore, base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD
# Without the keystore the bundle is unsigned (and the Play Store won't take it); the APK is always signed, with a
# debug key, so it installs.
name: Build the Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # (all the history: the version code is the commit count)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"            # (the app's Python: Chaquopy packs the server with the same version)

      - name: The game's pictures, sounds and music for the web page (web/assets)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install pygame numpy
          python -I tools/export_web_assets.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: The upload key (if there is one)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "DS_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          DS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export DS_VERSION_CODE=$(git rev-list --count HEAD)
          export DS_VERSION_NAME="$(cat VERSION).$DS_VERSION_CODE"
          gradle -p android assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: shards-of-ashen-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
