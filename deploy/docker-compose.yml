# The game and Caddy in front of it (HTTPS certificates from Let's Encrypt, automatically).
#   cp deploy/example.env deploy/.env   (set DS_DOMAIN)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DS_MAX_PLAYERS: ${DS_MAX_PLAYERS:-5}
      DS_REGISTRATION: ${DS_REGISTRATION:-open}
      DS_INVITE_CODE: ${DS_INVITE_CODE:-}
      DS_ADMINS: ${DS_ADMINS:-}
    volumes:
      - ${DS_DATA:-gamedata}:/data
    stop_grace_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [game]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DS_DOMAIN: ${DS_DOMAIN:?set DS_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  gamedata:
  caddy_data:
  caddy_config:
