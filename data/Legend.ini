; Lines townsfolk tell of what you've actually done (dsengine/rumours.py legend_due). CONDITION|what's said
[Lines]
1=$Attr.Legend.Died.Goose>=1|I heard $Player.Name was killed by a goose. An actual goose. I'd not have mentioned it, only everyone else has.
2=$Attr.Legend.Died.Rat>=1|They say $Player.Name was seen off by a rat. A single rat. It's got a name now, that rat.
3=$Attr.Legend.Died.Goblin>=2|Goblins have a song about $Player.Name, you know. It's mostly about running.
4=$Attr.Legend.Deaths>=10|$Player.Name has been dead more often than the undertaker's been paid. Bad for trade, that.
5=$Attr.KingQuest>=1|So $Player.Name's been to see the King. I said they looked royal. I did. Ask anyone.
6=$Attr.Deep.Heart>=1|They say $Player.Name went right to the bottom of the Shifting Deep, and came back up with their boots on.
7=$Attr.GalaithQuest>=2|It was $Player.Name who killed the dragon, or so they tell me. Thought they'd be taller.
8=$Attr.ArenaWins>=5|I had a coin on $Player.Name at the arena. Paid for the roof, that did.
9=$Attr.TrousersQuest>=3|That business with the Mayor's trousers. Everyone knows it was $Player.Name who cracked it. A goose, was it?
10=$Attr.Grudge.Times>=2|Something's after $Player.Name, I hear. Big, scarred, and it knows their name.
