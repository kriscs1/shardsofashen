; The day going round (dragonsword\daynight.py). A day is Config.ini [Gameplay] Day.Minutes long; a time of day is a
; fraction of it: 0 = midnight, 0.25 = 6 am, 0.5 = noon, 0.75 = 6 pm.

[Sky]
; The colour laid over the world (outdoors, on the surface) through the day: <time>=R G B strength (strength 0-255,
; 0 = none). In between two times it eases from one to the next.
0.00=8 12 42 168
0.18=8 12 42 168
0.22=60 40 96 120
0.26=255 140 90 60
0.31=255 200 140 0
0.70=255 200 140 0
0.74=255 150 60 40
0.78=210 80 70 78
0.82=60 36 96 125
0.86=8 12 42 168
1.00=8 12 42 168

[Night]
; When night falls (the night folk come out, the day folk go home: Entities.ini Schedule) and when it ends
From=0.83
To=0.21
; How much of the dark there is under a roof (the lamps are lit)
Indoors=0.55
; The warm glow added round every light (Tiles.ini / Entities.ini Light=) at night
Glow.Colour=70 38 8
; What's said as night falls and as it ends
Falls=Night falls. Lamps are lit in the windows.
Ends=The sun is coming up.

[Periods]
; What the time of day is called (the clock, the journal): the name up to each time.
0.21=Night
0.27=Dawn
0.42=Morning
0.58=Midday
0.72=Afternoon
0.80=Evening
0.86=Dusk
1.01=Night

[Sleep]
; Sleeping in a bed (anything with Sleep in its Use.Words, or a script's Sleep command): you sleep through the night to
; the morning, or through the day to the evening.
; When you wake up after a night's sleep, and after sleeping through the day
Morning=0.27
Evening=0.80
; 1 = you wake with your hitpoints full
Heal=1
; You can't sleep with a foe this close (pixels), or this many seconds after a fight
Foe.Range=320
Fight.Seconds=10
; Milliseconds the screen takes to go dark (and to come back), and stays dark
Fade=1200
Hold=1400
; What's shown while you sleep, and said
Text=Zzz...
Wake.Morning=You wake up rested as the sun comes up.
Wake.Evening=You wake up rested as evening falls.
Foes=You can't sleep with enemies nearby!
Fighting=You're too wound up to sleep after that fight.
No.Day=There's no day or night to sleep through.
