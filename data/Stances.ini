[Fighting.Shieldwall]
; A form of Fighting (forms.py): its numbers times the stance's
Title=Shieldwall
What=A much firmer guard, slower on foot; monsters near come for you before your friends.
Colour=170,180,200
Taught.By=Smuggler_Sergeant
Taught.If=$Attr.SmugglerSide=2
Taught.Words="You held the line in Meg's camp like one of mine," Holt says. "Here: the way the watch holds a door. Feet set, shield up, and let them come to you, not to the lad beside you."
Defence=1.4
Walk=0.8
Draw=160

[Fighting.Reckless]
; A form of Fighting (forms.py): its numbers times the stance's
Title=Reckless
What=Harder blows, a weaker guard; a kill gives you a moment's rush (quicker, and harder still).
Colour=240,120,40
Taught.By=Arena_Master
Taught.If=$Attr.ArenaWins>=3 or $Attr.Kills>=300
Taught.Words=The Arena Master looks you up and down. "I've watched you. You fight like you've nothing to lose, so lose the rest of it: forget your guard and finish them. One down, and on to the next before they know it."
Damage=1.25
Defence=0.8
Rush.Seconds=4
Rush.Damage=1.2
Rush.Walk=1.3

[Fighting.Duellist]
; A form of Fighting (forms.py): its numbers times the stance's
Title=Duellist
What=More of your blows land, and now and then you turn one of theirs aside.
Colour=235,215,120
Taught.By=Palace_Captain
Taught.If=$Attr.GuardQuest>=5
Taught.Words="A guard of the palace fights with a point, not a club," Captain Hart says, and shows you: the blade always between you and them, a flick of the wrist to turn a blow.
Attack=1.3
Parry=12

[Fighting.Dirty_Fighting]
; A form of Fighting (forms.py): its numbers times the stance's
Title=Dirty Fighting
What=Your blows can daze for a moment; a weaker guard.
Colour=130,160,60
Daze=12
Daze.Seconds=1.5
Defence=0.85

[Channelling.Stormcaller]
; A form of Channelling (forms.py): its numbers times the stance's
Title=Stormcaller
What=Your spells much stronger, and dearer in Shards.
Colour=250,240,130
Taught.By=Bert
Taught.If=$Attr.ShardgateQuest>=5
Taught.Words="The gate taught me something," Bert says. "Don't sip the Shards. Pull. Pull everything you've got through at once. It costs, oh, it costs, but you should have seen the cat's face."
Spell.Power=1.3
Spell.Cost=1.5

[Channelling.Wardkeeper]
; A form of Channelling (forms.py): its numbers times the stance's
Title=Wardkeeper
What=Your wards last twice as long, and drains and poisons hardly touch you.
Colour=120,230,220
Taught.By=Warden_Ysolde
Taught.If=$Attr.WardenQuest>=3
Taught.Words="The Wardens kept the watch for a hundred years," Ysolde says. "This is how we kept ourselves: the Shards held close, like a cloak against the cold."
Spell.Duration=2
Resist.Status=1.6

[Channelling.Listening]
; A form of Channelling (forms.py): its numbers times the stance's
Title=Listening
What=You hear Shards: remnants, clusters and Shard secrets near you show.
Colour=150,120,255
Taught.By=Warden_Ysolde
Taught.If=$Attr.WardensHeard>=2
Taught.Words="You heard it, down there, and didn't answer," Ysolde says. "Then you can learn what we learnt: to hear the Shards without them hearing you."
Hear.Shards=320

[Channelling.Drinking]
; A form of Channelling (forms.py): its numbers times the stance's
Title=Drinking
What=Remnants on the ground near you are drunk straight off, and heal you; a very weak guard; the Shards whisper to you.
Colour=200,60,90
Drink.Reach=96
Drink.Heal=2
Defence=0.6
Whisper.1=Something in the Shards says your name, very softly.
Whisper.2=The Shards in you are warm. They like it here.
Whisper.3=More, says something at the edge of hearing. There's always more.
Whisper.4=For a moment you remember a place you've never been: a hall of glass, and singing.
Taught.By=Sister_Linnet
Taught.If=$Attr.GreyEnd=2
Taught.Words=Sister Linnet takes your hands and closes them round a Shard. "Don't fight it, $Player.Brother. Let it in. It only ever wanted to be part of you." It goes into your palms, warm, and something in you is thirstier than it was.

[Sneaking.Cutpurse]
; A form of Sneaking (forms.py): its numbers times the stance's
Title=Cutpurse
What=Better hands for pockets and shelves, and those watching look the other way more.
Colour=200,170,60
Taught.By=Red_Meg
Taught.If=$Attr.SmugglerSide=1
Taught.Words=Meg grins and lifts your purse, and gives it back, all in one move. "Watch the eyes, not the pocket. When they look away, you're already done."
Thieving=15
Watched=0.5

[Sneaking.Shadow]
; A form of Sneaking (forms.py): its numbers times the stance's
Title=Shadow
What=Harder to see and to hear, and a harder blow from where they never saw you.
Colour=90,70,140
Taught.By=Ambrose_At_Home
Taught.If=$Attr.RedrockWay=2
Taught.Words="Forty years I caught thieves," Ambrose says, "and I know how they're seen: by moving when you're looked at. Be still when eyes are on you, and you're a shadow."
Sight=0.75
Noise=0.85
Sneak.Attack=1.5

[Sneaking.Rangers_Tread]
; A form of Sneaking (forms.py): its numbers times the stance's
