[Passage to the Mainland]
Giver=Woman
Attribute=Passage
Stage0=Speak to Maren, the ferrywoman, at the end of the pier in the south of the Isle.
Stage1=The first crossing needs a ticket. Ask Bess, Maren's sister, the milkmaid on the farm in the north.
Stage2=A goblin stole Bess's ticket book. First, chop 3 logs for her range with the axe she lent you (Chop a tree).
Stage3=Collect an egg from the hen coop and fry it on Bess's range, in her hut (use the egg on the range). Take it to her.
Stage4=Make a wooden sword and a wooden shield at the workbench in the barn, wield both, and show Bess.
Stage5=Ask Brother Aldous at the chapel about the cellar.
Stage6=Brother Aldous lost the cellar key among the barrels and crates in the cellar. Find it (Search them).
Stage7=Go down through the cellar's trapdoor into the caves and find Bess's ticket book.
Stage8=The book is in a locked goblin's cage, out of reach. Ask Brother Aldous for help.
Stage9=Cast Grasp at the goblin's cage to pull the ticket book out (Cast the scroll, then click the cage).
Stage10=Take the ticket book back to Bess.
Stage11=Show your stamped ticket to Maren on the pier and sail to Southport.
Done=12
